name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: App, tests, and bundle (Intel)
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Export canonical bundle metadata
        run: ./scripts/export-canonical-metadata.sh

      - name: Verify pinned runner and toolchain
        run: |
          test "$(uname -m)" = "x86_64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "15"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 16.4"
          swift --version

      - name: Restore explicit SwiftPM and tool caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Loqui/.build
            ~/.cache/loqui-tools
          key: loqui-v1-${{ runner.os }}-${{ runner.arch }}-xcode-16.4-${{ hashFiles('Loqui/Package.swift', 'Loqui/Package.resolved') }}
          restore-keys: |
            loqui-v1-${{ runner.os }}-${{ runner.arch }}-xcode-16.4-

      - name: Install digest-pinned lint tools
        run: |
          tool_bin="$(./scripts/install-ci-tools.sh)"
          echo "$tool_bin" >> "$GITHUB_PATH"

      - name: Validate shell, plist, version, lint, and format policy
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -not -path './Loqui/.build/*' -print0)
          plutil -lint Loqui/Info.plist Loqui/Loqui.entitlements
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Loqui/Info.plist >/dev/null 2>&1; then
            echo 'Loqui/Info.plist must not duplicate VERSION' >&2
            exit 1
          fi
          ./scripts/read-version.sh
          ./scripts/changelog.sh check
          swiftlint lint --strict --config .swiftlint.yml
          swiftformat --lint --config .swiftformat Loqui/Sources Loqui/Tests

      - name: Build debug and release for every supported architecture
        run: |
          for configuration in debug release; do
            for architecture in arm64 x86_64; do
              swift build \
                --package-path Loqui \
                --configuration "$configuration" \
                --triple "$architecture-apple-macosx$LOQUI_MINIMUM_SYSTEM_VERSION" \
                --scratch-path "Loqui/.build/$configuration-$architecture" \
                -Xswiftc -warnings-as-errors
            done
          done

      - name: Run all tests
        run: |
          swift test \
            --package-path Loqui \
            --configuration debug \
            --triple "x86_64-apple-macosx$LOQUI_MINIMUM_SYSTEM_VERSION" \
            --scratch-path Loqui/.build/tests-x86_64 \
            -Xswiftc -warnings-as-errors
          bash tests/dependency-tool-fixtures.sh
          bash tests/signing-identity-tests.sh
          bash tests/changelog-tests.sh

      - name: Assemble and verify extracted deterministic test bundle
        run: |
          fixture_dir="$RUNNER_TEMP/loqui-model-fixture"
          python3 tests/create-parakeet-fixture.py "$fixture_dir"
          export LOQUI_MODEL_MANIFEST="$fixture_dir/manifest.json"
          export LOQUI_MODEL_PATH="$fixture_dir/parakeet-tdt-0.6b-v2-coreml"
          LOQUI_SIGNING_MODE=adhoc ./bundle.sh
          archive="$RUNNER_TEMP/$LOQUI_BUNDLE_NAME-ci.zip"
          extracted="$RUNNER_TEMP/extracted"
          ditto -c -k --sequesterRsrc --keepParent "$LOQUI_BUNDLE_NAME.app" "$archive"
          mkdir -p "$extracted"
          ditto -x -k "$archive" "$extracted"
          LOQUI_EXPECTED_SIGNATURE=adhoc LOQUI_X86_64_SMOKE_TEST=1 \
            ./scripts/verify-bundle.sh "$extracted/$LOQUI_BUNDLE_NAME.app"

  backend-contract:
    name: Parakeet backend (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Export canonical bundle metadata
        run: ./scripts/export-canonical-metadata.sh

      - name: Verify native architecture and toolchain
        run: |
          test "$(uname -m)" = "${{ matrix.architecture }}"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "15"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 16.4"
          swift --version

      - name: Restore reviewed Parakeet weights
        if: matrix.architecture == 'arm64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: loqui-parakeet-v2-${{ hashFiles('Loqui/Sources/LoquiParakeet/Resources/parakeet-model.json') }}

      - name: Install and verify the pinned production model
        if: matrix.architecture == 'arm64'
        run: ./scripts/dependency-tool.sh install-model

      - name: Exercise Parakeet inference or unsupported-hardware preflight
        env:
          LOQUI_PARAKEET_SMOKE_TEST: '1'
          LOQUI_TEST_AUDIO: ${{ github.workspace }}/tests/fixtures/jfk.wav
        run: |
          swift test --package-path Loqui \
            --triple "${{ matrix.architecture }}-apple-macosx$LOQUI_MINIMUM_SYSTEM_VERSION" \
            --scratch-path Loqui/.build/parakeet-${{ matrix.architecture }} \
            --filter ParakeetIntegrationTests -Xswiftc -warnings-as-errors

  version-bump:
    name: Version and changelog
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Require a raised VERSION with a changelog section
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./scripts/changelog.sh check-bump "origin/$BASE_REF"

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - quality
      - backend-contract
      - version-bump
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BACKEND_RESULT: ${{ needs.backend-contract.result }}
          VERSION_RESULT: ${{ needs.version-bump.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BACKEND_RESULT" = success
          # The version check runs only on pull requests.
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$VERSION_RESULT" = success
          else
            test "$VERSION_RESULT" = skipped
          fi
